<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Postal Radius Search</title>
<style>body{font-family:Segoe UI,sans-serif;margin:2rem;max-width:760px}input,select,button{padding:.4rem;margin-right:.4rem}
table{border-collapse:collapse;margin-top:1rem;width:100%}td,th{border-bottom:1px solid #ddd;padding:.3rem .5rem;text-align:left}.err{color:#b00}</style></head>
<body><h2>US Postal Code Radius Search (DEV)</h2>
<form id="f"><input id="pc" placeholder="Postal code" maxlength="5" value="55344" required>
<input id="r" type="number" min="1" max="1000" step="any" value="10" required>
<select id="u"><option value="mi">miles</option><option value="km">km</option></select><button>Search</button></form>
<div id="out"></div>
<script>
document.getElementById('f').onsubmit = async e => {
  e.preventDefault();
  const out = document.getElementById('out'); out.textContent = 'Searching...';
  const q = new URLSearchParams({postalCode: pc.value, radius: r.value, unit: u.value});
  const res = await fetch('/api/postalcodes/radius?' + q); const j = await res.json();
  if (!res.ok) { out.innerHTML = '<p class="err">' + (j.error || j.detail || res.status) + '</p>'; return; }
  out.innerHTML = `<p>${j.count} postal codes within ${j.radius} ${j.unit} of ${j.postalCode} (${j.latitude}, ${j.longitude})</p>
  <table><tr><th>Postal code</th><th>Distance (${j.unit})</th><th>Lat</th><th>Long</th></tr>` +
  j.matches.map(m => `<tr><td>${m.postalCode}</td><td>${m.distance}</td><td>${m.latitude}</td><td>${m.longitude}</td></tr>`).join('') + '</table>';
};
</script></body></html>
